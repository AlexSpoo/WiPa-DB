<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WiPa DB - Umbenennen</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <app-header></app-header>
    <main class="rename">
      <div class="rename-edit-view" id="rename-edit-view">
        <div class="rename-topbar">
            <span class="rename-filename-label">Datei-Name:</span>
            <div class="rename-topbar-row">
                <div class="rename-filename">
                    <span id="rename-original-name" class="rename-original-name"></span>
                    <span class="rename-arrow">→</span>
                    <div class="rename-name-field">
                        <input type="text" id="rename-new-name" class="rename-new-name-input" readonly>
                        <button type="button" id="rename-edit-name-button" class="rename-edit-name-button" aria-label="Namen manuell bearbeiten">✎</button>
                    </div>
                </div>
                <label class="rename-next-toggle">
                    <input type="checkbox" id="rename-show-next-checkbox">
                    Nächstes Bild anzeigen
                </label>
            </div>
        </div>

        <div class="rename-image-row" id="rename-image-row">
            <div class="rename-image-box" id="rename-image-box">
                <img id="rename-image" class="rename-image" alt="">
            </div>
            <div class="rename-image-box rename-image-box--preview" id="rename-preview-box">
                <img id="rename-preview-image" class="rename-image" alt="">
            </div>
        </div>

        <div class="rename-fields">
            <div class="rename-field">
                <label for="rename-type-select">Art der Datei</label>
                <select id="rename-type-select">
                    <option value="protokoll">Protokoll</option>
                    <option value="screenshot">Screenshot</option>
                    <option value="szenariobild">Szenariobild</option>
                </select>
            </div>
            <div class="rename-field">
                <label for="rename-event-select">Event</label>
                <select id="rename-event-select">
                    <option value="" selected disabled>Event wählen</option>
                </select>
            </div>
            <div class="rename-field rename-field--screenshot-type is-hidden" id="rename-screenshot-type-field">
                <label for="rename-screenshot-type-select">Screenshot-Typ</label>
                <select id="rename-screenshot-type-select">
                    <option value="" selected disabled>Typ wählen</option>
                </select>
            </div>
            <div class="rename-field is-hidden" id="rename-szenariobild-name-field">
                <label for="rename-szenariobild-name-input">Name</label>
                <input type="text" id="rename-szenariobild-name-input" placeholder="z. B. Mobilität">
            </div>
            <div class="rename-field rename-field--number" id="rename-number-field">
                <label for="rename-number-input">Nr.</label>
                <input type="text" id="rename-number-input">
            </div>
            <div class="rename-nav-buttons">
                <button type="button" id="rename-back-button" class="btn btn-primary btn-shadow-inset">
                    ← Zurück
                </button>
                <button type="button" id="rename-overview-button" class="btn btn-primary btn-shadow-inset is-hidden">
                    Zur Übersicht
                </button>
                <button type="button" id="rename-skip-button" class="btn btn-primary btn-shadow-inset">
                    Überspringen
                </button>
                <button type="button" id="rename-next-button" class="btn btn-primary btn-shadow-inset">
                    Nächstes Bild
                </button>
            </div>
        </div>
      </div>

      <div class="rename-summary is-hidden" id="rename-summary">
          <ul class="rename-summary-list" id="rename-summary-list"></ul>
          <div class="rename-summary-actions">
              <button type="button" id="rename-summary-save-button" class="btn btn-primary btn-shadow-inset">
                  Bilder speichern
              </button>
          </div>
      </div>
    </main>
    <script type="module" src="/shared/app-header.js"></script>
    <script type="module" src="rename.js"></script>
</body>
</html>
