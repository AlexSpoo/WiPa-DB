<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WiPa DB - Dashboard</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <main class="dashboard">
    <h1>Übersicht</h1>
    <div id="dashboard-message" class="dashboard-message"></div>
    <div class="dashboard-grid">
      <a id="nav-upload" href="upload.html" class="dashboard-tile btn btn-primary btn-shadow-inset">Bilder Hochladen</a>
      <a id="nav-transcribe" href="transcribe.html" class="dashboard-tile btn btn-primary btn-shadow-inset">Bilder digitalisieren</a>
      <a id="nav-templates" href="templates.html" class="dashboard-tile btn btn-primary btn-shadow-inset">Templates verwalten</a>
      <a id="nav-tag" href="tag.html" class="dashboard-tile btn btn-primary btn-shadow-inset">Daten vertaggen</a>
      <a id="nav-evaluate" href="evaluate.html" class="dashboard-tile btn btn-primary btn-shadow-inset">Daten auswerten</a>
      <a id="nav-export" href="export.html" class="dashboard-tile btn btn-primary btn-shadow-inset">Vault/Datenbank exportieren</a>
    </div>
    <div class="vault-switcher">
      <button type="button" id="vault-switcher-toggle" class="btn btn-primary" aria-expanded="false">📁 <span id="vault-switcher-current"></span></button>
      <div class="vault-switcher-menu" id="vault-switcher-menu">
          <div id="vault-switch-view">
              <div id="vault-list"></div>
              <div id="vault-list-divider" class="vault-switcher-divider is-hidden"></div>
              <button type="button" id="vault-add-button" class="btn btn-primary">+ Neue Datenbank</button>
              <div class="vault-switcher-divider"></div>
              <button type="button" id="vault-manage-button" class="btn btn-primary">Datenbanken verwalten</button>
          </div>
          <div id="vault-manage-view" class="is-hidden">
              <div id="vault-manage-list"></div>
              <button type="button" id="vault-manage-back-button" class="btn btn-primary">← Zurück</button>
          </div>
      </div>
  </div>
  </main>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
