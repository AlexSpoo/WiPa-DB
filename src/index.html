<!DOCTYPE html>
<html lang="de">
<head>

      <span data-i18n="start.connect-db-button">Datenbank finden und verknüpfen</span>
    </button>
    <a class="link-secondary" href="#">
      <span data-i18n="start.help-find-db">Wie du die Datenbank findest und herunterlädst</span>
    </a>
  </main>
  <script type="module" src="main.js"></script>
